  <g transform="translate(16 16) scale(0.82) translate(-16 -16)">
    <path d="M11 22 A6.5 6.5 0 1 1 11 10 L21 22 A6.5 6.5 0 1 0 21 10"
          fill="none" stroke="#35C48B" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="21" cy="10" r="3.2" fill="#E8853A"/>
  </g>
</svg>
