<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Tab icons render at 16px. The mark is drawn on its own dark tile with a
       heavier stroke and a slightly larger dot than the in-page logo, or it
       disappears against a light browser chrome. -->
