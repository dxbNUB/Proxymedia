<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Runs before first paint. Only browsers that will actually animate get
      // the hidden starting state, so the page is never blank while JS loads.
      document.documentElement.classList.add('js')

      // Safety net: if the bundle never arrives, drop back to plain visible
      // content instead of leaving reveals stuck at opacity 0.
      setTimeout(function () {
        if (!document.documentElement.classList.contains('hydrated')) {
          document.documentElement.classList.remove('js')
        }
      }, 5000)
    </script>

    <!-- ── Core ──────────────────────────────────────────────────────── -->
    <title>AI Automation Company in Dubai, UAE | Proxymedia</title>
    <meta
      name="description"
      content="Proxymedia is an AI automation company in Dubai serving the UAE, Saudi Arabia and the wider GCC. We build and run systems that handle follow-ups, export documents, order entry and reporting — self-hosted and PDPL compliant. Fixed price, live in 3–5 weeks."
    />
    <link rel="canonical" href="https://proxymedia.ae/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#0f1a16" />
    <meta name="color-scheme" content="dark" />

    <!-- The automation loop, same mark as the nav. All rasters are generated
         from favicon.svg by scripts/icons.mjs, so they cannot drift.
         favicon.ico must exist at the root even though it is declared here:
         Google's favicon crawler and older clients request /favicon.ico
         directly and ignore these tags. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Regional targeting -->
    <meta name="geo.region" content="AE-DU" />
    <meta name="geo.placename" content="Dubai, United Arab Emirates" />
    <link rel="alternate" hreflang="en-ae" href="https://proxymedia.ae/" />
    <link rel="alternate" hreflang="x-default" href="https://proxymedia.ae/" />

    <!-- ── Social ────────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Proxymedia" />
    <meta property="og:locale" content="en_AE" />
    <meta property="og:url" content="https://proxymedia.ae/" />
    <meta property="og:title" content="AI Automation Company in Dubai, UAE | Proxymedia" />
    <meta
      property="og:description"
      content="We build and run AI automation for businesses in the UAE and GCC — follow-ups, export documents, order entry and live dashboards. Self-hosted, PDPL compliant, fixed price."
    />
    <meta property="og:image" content="https://proxymedia.ae/hero-field-depot.jpg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1599" />
    <meta property="og:image:alt" content="Aerial view of a crop field meeting a haulage depot in the UAE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Automation Company in Dubai, UAE | Proxymedia" />
    <meta
      name="twitter:description"
      content="AI automation for UAE and GCC businesses. Self-hosted, PDPL compliant, fixed price, live in 3–5 weeks."
    />
    <meta name="twitter:image" content="https://proxymedia.ae/hero-field-depot.jpg" />

    <!-- ── Performance ───────────────────────────────────────────────── -->
    <link
      rel="preload"
      as="image"
      href="/hero-field-depot.webp"
      imagesrcset="/hero-field-depot-1400.webp 1400w, /hero-field-depot.webp 2400w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <!-- ── Structured data ───────────────────────────────────────────────
         Static in the HTML so crawlers read it without executing React. -->

            "priceRange": "$$",

            },
            "areaServed": [

              { "@type": "Country", "name": "Qatar" },
              { "@type": "Country", "name": "Oman" },
              { "@type": "Country", "name": "Kuwait" },
              { "@type": "Country", "name": "Bahrain" }
            ],

              "Export documentation automation",
              "Accounts receivable automation",
              "Self-hosted automation",
              "UAE PDPL compliance"
            ],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Automation services",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",

                    "description": "A two-week review of how work moves through your business, with a costing of each manual step and a prioritised list of what to automate first."
                  },
                  "price": "1500",

                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",

                    "description": "Fixed-scope build of an automation system connected to your existing CRM, ERP or spreadsheets, deployed on infrastructure you own, with team training."
                  },
                  "price": "4000",

                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Managed Automation",

                  },

                  "priceCurrency": "USD"
                }
              ]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://proxymedia.ae/#website",
            "url": "https://proxymedia.ae/",
            "name": "Proxymedia",
            "inLanguage": "en-AE",
            "publisher": { "@id": "https://proxymedia.ae/#organization" }
          },
          {
            "@type": "FAQPage",
            "@id": "https://proxymedia.ae/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How long until something is running?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The audit takes two weeks. A first build is usually live three to five weeks after that, and we scope it so there is something working well before the end."
                }
              },
              {
                "@type": "Question",
                "name": "Where does our data live?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "On a server you own, in a region you choose. We deploy with Docker, hand over the keys, and nothing is used to train models."
                }
              },
              {
                "@type": "Question",
                "name": "What if we already have software for this?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Usually the answer is to connect it rather than replace it. Most of what we build sits on top of the CRM, ERP or spreadsheets your team already knows."
                }
              },
              {
                "@type": "Question",
                "name": "What happens if we stop working with you?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You keep the server, the code and the credentials. There is no licence to cancel and nothing stops working because an invoice went unpaid."
                }
              },
              {
                "@type": "Question",
                "name": "Do you work outside agricultural exports?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes — collections, trade and logistics are the other two we know well. The agri work is where we go deepest."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>

  </body>
</html>
